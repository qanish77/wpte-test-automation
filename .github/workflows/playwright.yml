name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which test suite to run'
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - auth
          - admin
          - account
          - booking
          - trips

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Create .env file
      run: |
        cat <<'EOF' > .env
        BASE_URL="${{ secrets.BASE_URL }}"
        TEST_USER_EMAIL="${{ secrets.TEST_USER_EMAIL }}"
        TEST_USER_PASSWORD="${{ secrets.TEST_USER_PASSWORD }}"
        ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
        ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
        EOF

    - name: Run Playwright tests (${{ inputs.suite }})
      id: run_tests
      continue-on-error: true
      # Some suite scripts (e.g. test:smoke) hardcode --reporter=list for terminal
      # use, which replaces (not adds to) the config's reporters and skips the html
      # report entirely. Force list+html back on for CI only; package.json untouched.
      run: npm run test:${{ inputs.suite }} -- --reporter=list,html

    - name: Upload report as build artifact
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Prepare report for GitHub Pages
      if: ${{ !cancelled() }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report/

    - name: Deploy report to GitHub Pages
      if: ${{ !cancelled() }}
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Fail job if tests failed
      if: always() && steps.run_tests.outcome != 'success'
      run: exit 1
